# Publishes the demo to GitHub Pages, the way react-dockable-desktop does:
#
#   https://felipecarrillo100.github.io/vue-dockable-desktop/        → the landing page
#   https://felipecarrillo100.github.io/vue-dockable-desktop/demo/   → the demo
#
# Unlike rdd, no `--base` is needed: `demo/vite.config.ts` sets `base: './'`, so the built
# demo is path-agnostic and the same artifact works at the root or under /demo/. That was
# verified against the production build served from a sub-path, Monaco's workers included.
#
# Verification lives in gate.yml, which runs on the same push. This workflow deliberately
# does not wait for it: a deploy that is blocked by a flaky browser gate is worse than a
# deploy of a demo whose failure the gate reports a minute later.
name: Deploy Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Builds the library too, by way of the demo's alias onto `src/` — the demo is the
      # library's own code, exercised as a consumer would import it.
      - name: Build demo
        run: npm run demo:build

      # `_site` is assembled here rather than built into: the demo's outDir is
      # `artifacts/demo`, which the repository also uses for gate evidence.
      - name: Assemble the site
        run: |
          mkdir -p _site/demo
          cp -r artifacts/demo/. _site/demo/
          cp .github/pages/index.html _site/index.html
          test -f _site/index.html
          test -f _site/demo/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
